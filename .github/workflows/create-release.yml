name: Create Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create v2.0 Release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'cf-real-ip-nginx-V2.0',
              name: 'v2.0',
              target_commitish: 'master',
              body: `## 🚀 What\'s New in v2.0 — Full Auto Installer

> One command. No manual config editing. No guessing paths.

\`\`\`bash
sudo ./cfips-nginx.sh --install
\`\`\`

---

### ✅ Auto-Detects Your nginx Setup
- Finds the nginx instance **actually running** on your server
- Multiple nginx installs? (e.g. custom build + distro package) — lists all versions and lets you pick
- Derives config directory directly from the nginx binary — works for apt/yum packages, source-compiled builds, and OpenResty

### ✅ Patches nginx.conf Automatically
- Injects \`include cfips.conf;\` into the \`http {}\` block
- Creates a timestamped backup before touching anything
- Rolls back automatically if \`nginx -t\` fails

### ✅ IPv6 Support
- Now fetches both \`ips-v4\` **and** \`ips-v6\` from Cloudflare
- Full coverage for dual-stack servers

### ✅ Cleans Up Old Installs
- Detects and removes previous \`cfips.txt\` and legacy include files before installing
- Prevents duplicate directive errors that would break nginx on upgrade

### ✅ Weekly Auto-Update via Cron
- Installs \`/etc/cron.d/cf-nginx-realip\` automatically
- Cloudflare IP ranges refresh weekly — no manual intervention needed
- Skips nginx reload if nothing changed (idempotent)

### ✅ Atomic Writes + Auto-Rollback
- Config written to staging first, validated with \`nginx -t\`, then moved into place
- Previous config restored automatically on any failure

### ✅ \`real_ip_recursive on;\` Added
- Correctly resolves real IPs through multiple proxy layers

---

### ⚠️ Breaking Changes
| | v1.x | v2.0 |
|---|---|---|
| Output file | \`cfips.txt\` | \`cfips.conf\` |
| nginx path | Hardcoded \`/usr/local/nginx/conf\` | Auto-detected |

---

### ⬆️ Upgrading from v1.x

\`\`\`bash
git pull
sudo ./cfips-nginx.sh --install
\`\`\`

The installer automatically removes \`cfips.txt\`, writes \`cfips.conf\`, updates \`nginx.conf\`, and reloads nginx.`,
              draft: false,
              prerelease: false
            });
